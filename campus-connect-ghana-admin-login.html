<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Campus Connect Ghana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --navy:#0B1F3A; --navy-2:#071630;
  --gold:#F2B705; --gold-dim:#C99400;
  --green:#146B3C; --red:#C8102E;
  --charcoal-70:rgba(255,255,255,.6);
  --line:rgba(255,255,255,.14); --white:#fff;
  --display:'Fraunces',serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--body); color:var(--white);
  background:
    radial-gradient(700px 400px at 15% 10%, rgba(20,107,60,.18), transparent 60%),
    radial-gradient(600px 380px at 90% 90%, rgba(200,16,46,.14), transparent 60%),
    var(--navy-2);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none;} button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}

.card{
  background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:10px;
  padding:44px 40px; max-width:400px; width:100%; backdrop-filter:blur(6px);
}
.top-row{display:flex; align-items:center; gap:10px; margin-bottom:30px;}
.brand-mark{width:32px; height:32px; border-radius:7px; background:var(--gold); color:var(--navy); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:700; font-size:14px;}
.brand-text{font-family:var(--mono); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--charcoal-70);}
.brand-text strong{color:var(--white); display:block; font-family:var(--display); font-size:15px; letter-spacing:0; text-transform:none; margin-top:2px;}

.restricted{
  display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:1px;
  color:var(--red); background:rgba(200,16,46,.12); border:1px solid rgba(200,16,46,.3);
  padding:8px 12px; border-radius:5px; margin-bottom:26px; text-transform:uppercase;
}
.restricted .dot{width:6px; height:6px; border-radius:50%; background:var(--red);}

h1{font-family:var(--display); font-weight:600; font-size:23px;}
.sub{margin-top:8px; font-size:13.5px; color:var(--charcoal-70); line-height:1.6;}

.field{margin-top:20px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--gold); margin-bottom:7px; letter-spacing:.3px; font-family:var(--mono); text-transform:uppercase;}
.field input{width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:5px; font-family:var(--mono); font-size:13.5px; background:rgba(255,255,255,.04); color:var(--white); transition:border-color .15s ease;}
.field input::placeholder{color:rgba(255,255,255,.3);}
.field input:focus{border-color:var(--gold); outline:none;}
.pass-wrap{position:relative;}
.pass-wrap .toggle{position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--charcoal-70); font-family:var(--mono); cursor:pointer;}

.otp-mini{display:flex; gap:8px; margin-top:8px;}
.otp-mini input{width:38px; height:44px; text-align:center; font-size:16px; padding:0;}

.btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:13px 18px; border-radius:5px; border:none; font-size:13.5px; font-weight:700; letter-spacing:.3px; transition:transform .15s ease, box-shadow .15s ease, background .15s ease;}
.btn-gold{background:var(--gold); color:var(--navy); margin-top:26px; font-family:var(--mono); text-transform:uppercase;}
.btn-gold:hover{background:#ffc61a; transform:translateY(-1px); box-shadow:0 8px 20px rgba(242,183,5,.25);}

.foot-note{margin-top:22px; text-align:center; font-family:var(--mono); font-size:10.5px; color:rgba(255,255,255,.3); letter-spacing:.5px;}
.back-link{display:block; margin-top:14px; text-align:center; font-size:12px; color:var(--charcoal-70);}
</style>
</head>
<body>

<div class="card">
  <a href="campus-connect-ghana-homepage.html" class="top-row" style="text-decoration:none;">
    <span class="brand-mark">CC</span>
    <span class="brand-text">Campus Connect Ghana<strong>Admin Console</strong></span>
  </a>

  <div class="restricted"><span class="dot"></span> Authorized personnel only</div>

  <h1>Admin sign in</h1>
  <p class="sub">This area is restricted to Campus Connect Ghana staff. All access attempts are logged.</p>

  <form onsubmit="event.preventDefault(); window.location.href='campus-connect-ghana-admin-dashboard.html';">
    <div class="field">
      <label for="admin-id">Admin ID or work email</label>
      <input type="text" id="admin-id" placeholder="admin@campusconnectgh.com" required>
    </div>
    <div class="field">
      <label for="admin-pass">Password</label>
      <div class="pass-wrap">
        <input type="password" id="admin-pass" placeholder="••••••••••••" required>
        <span class="toggle" onclick="const p=document.getElementById('admin-pass'); p.type = p.type==='password' ? 'text' : 'password'; this.textContent = p.type==='password' ? 'SHOW' : 'HIDE';">SHOW</span>
      </div>
    </div>
    <div class="field">
      <label>2FA verification code</label>
      <div class="otp-mini">
        <input type="text" maxlength="1" inputmode="numeric" onInput="if(this.value)this.nextElementSibling?.focus();">
        <input type="text" maxlength="1" inputmode="numeric" onInput="if(this.value)this.nextElementSibling?.focus();">
        <input type="text" maxlength="1" inputmode="numeric" onInput="if(this.value)this.nextElementSibling?.focus();">
        <input type="text" maxlength="1" inputmode="numeric" onInput="if(this.value)this.nextElementSibling?.focus();">
        <input type="text" maxlength="1" inputmode="numeric" onInput="if(this.value)this.nextElementSibling?.focus();">
        <input type="text" maxlength="1" inputmode="numeric" onInput="if(this.value)this.nextElementSibling?.focus();">
      </div>
    </div>
    <button type="submit" class="btn btn-gold">Access Admin Console</button>
  </form>

  <div class="foot-note">SESSION ENCRYPTED · SSL SECURED · IP LOGGED</div>
  <a href="campus-connect-ghana-login.html" class="back-link">← Not an admin? Student log in</a>
</div>

</body>
</html>
